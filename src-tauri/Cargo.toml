[package]
name = "kast"
version = "0.1.0"
edition = "2021"

[lib]
name = "kast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dunce = "1"          # canonicalize sem prefixo \\?\ no Windows
rodio = "0.19"       # saída de áudio (thread dedicada)

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
